name: Deploy LAZE QR Menu to FTP

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: Sync QR Menu to Live Server
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🚀 Sync Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'menu.lazekofte.com/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/*.sample.php
            inc/database.php
            **/*.md
